http_port 3128

# --- only these domains may be reached, over HTTPS only ---
acl allowed_domains dstdomain .openrouter.ai
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT allowed_domains SSL_ports
http_access allow allowed_domains
http_access deny all

# don't leak identifying headers to upstream
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all

# keep logs small; flip to /dev/null if you don't want any record
access_log daemon:/var/log/squid/access.log
